name: Prepare release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to prepare
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve and validate tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$PUSH_TAG"
          fi

          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: expected a semantic-version tag such as 0.0.14" >&2
            exit 1
          fi

          echo "value=$tag" >> "$GITHUB_OUTPUT"

  test:
    name: Test release tag
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  draft:
    name: Create draft release
    needs:
      - resolve
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to create." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          release_url="$(
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "VersionedDocC $TAG"
          )"

          {
            echo "## Draft release"
            echo
            echo "[$TAG]($release_url)"
            echo
            echo "Review the notes, select GitHub Marketplace, and publish the release."
          } >> "$GITHUB_STEP_SUMMARY"
